name: HMXHARNESS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hmxharness-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  verify:
    name: Tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=""
          for candidate in \
            "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -maxdepth 5 -type f -name sdkmanager 2>/dev/null | sort | tail -1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          for pkg in "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"; do
            "$SDKMANAGER" "$pkg" || echo "WARN: sdkmanager could not install $pkg"
          done

      - name: Unit tests
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace --max-workers=2

      - name: Lint (debug)
        run: bash ./gradlew :app:lintDebug --no-daemon --stacktrace --max-workers=2

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: HMXHARNESS-reports-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  build:
    name: Debug and signed release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    needs: verify
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Install Android SDK and native tools
        run: |
          SDKMANAGER=""
          for candidate in \
            "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -maxdepth 5 -type f -name sdkmanager 2>/dev/null | sort | tail -1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          for pkg in "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018" "cmake;3.22.1"; do
            "$SDKMANAGER" "$pkg" || echo "WARN: sdkmanager could not install $pkg"
          done
          sudo apt-get update
          sudo apt-get install -y glslc
          glslc --version

      - name: Prepare release keystore
        env:
          HMX_RELEASE_STORE_FILE_BASE64: ${{ secrets.HMX_RELEASE_STORE_FILE_BASE64 }}
          HMX_RELEASE_STORE_PASSWORD: ${{ secrets.HMX_RELEASE_STORE_PASSWORD }}
          HMX_RELEASE_KEY_ALIAS: ${{ secrets.HMX_RELEASE_KEY_ALIAS }}
          HMX_RELEASE_KEY_PASSWORD: ${{ secrets.HMX_RELEASE_KEY_PASSWORD }}
        run: |
          set -eu
          missing=""
          [ -n "${HMX_RELEASE_STORE_FILE_BASE64:-}" ] || missing="$missing HMX_RELEASE_STORE_FILE_BASE64"
          [ -n "${HMX_RELEASE_STORE_PASSWORD:-}" ] || missing="$missing HMX_RELEASE_STORE_PASSWORD"
          [ -n "${HMX_RELEASE_KEY_ALIAS:-}" ] || missing="$missing HMX_RELEASE_KEY_ALIAS"
          [ -n "${HMX_RELEASE_KEY_PASSWORD:-}" ] || missing="$missing HMX_RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing release signing secrets:$missing"
            exit 1
          fi
          umask 077
          keystore="$RUNNER_TEMP/hmx-release-keystore"
          printf '%s' "$HMX_RELEASE_STORE_FILE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          # Prove the decoded file is a real keystore and the alias exists. keytool
          # output here is public metadata (store type, alias, algorithm, digests).
          if ! keytool -list -keystore "$keystore" -storepass:env HMX_RELEASE_STORE_PASSWORD \
              > "$RUNNER_TEMP/keytool-list.txt" 2>&1; then
            echo "::error::The decoded keystore is unreadable with the provided store password."
            exit 1
          fi
          if ! keytool -list -keystore "$keystore" -storepass:env HMX_RELEASE_STORE_PASSWORD \
              -alias "$HMX_RELEASE_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Key alias '$HMX_RELEASE_KEY_ALIAS' is not present in the keystore."
            exit 1
          fi
          sed -n '1,12p' "$RUNNER_TEMP/keytool-list.txt"
          echo "HMX_RELEASE_STORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Build debug APK
        env:
          HMX_RELEASE_STORE_PASSWORD: ${{ secrets.HMX_RELEASE_STORE_PASSWORD }}
          HMX_RELEASE_KEY_ALIAS: ${{ secrets.HMX_RELEASE_KEY_ALIAS }}
          HMX_RELEASE_KEY_PASSWORD: ${{ secrets.HMX_RELEASE_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace --max-workers=2

      - name: Build signed release APK
        env:
          HMX_RELEASE_STORE_PASSWORD: ${{ secrets.HMX_RELEASE_STORE_PASSWORD }}
          HMX_RELEASE_KEY_ALIAS: ${{ secrets.HMX_RELEASE_KEY_ALIAS }}
          HMX_RELEASE_KEY_PASSWORD: ${{ secrets.HMX_RELEASE_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --no-daemon --stacktrace --max-workers=2

      - name: Verify APKs
        id: verify
        run: |
          set -eu
          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT2="$BUILD_TOOLS/aapt2"
          debug_apk="app/build/outputs/apk/debug/app-debug.apk"
          release_apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$debug_apk"
          test -f "$release_apk"

          fail() { echo "::error::$1"; exit 1; }

          echo "--- signatures ---"
          "$APKSIGNER" verify --print-certs --verbose "$debug_apk" | tee /tmp/debug-signature.txt
          "$APKSIGNER" verify --print-certs --verbose "$release_apk" | tee /tmp/release-signature.txt

          echo "--- release signature checks ---"
          if ! grep -q "^Verifies$" /tmp/release-signature.txt; then
            fail "apksigner did not verify the release APK"
          fi
          if ! grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/release-signature.txt; then
            fail "Release APK is not signed with APK Signature Scheme v2"
          fi
          if grep -qi "certificate DN:.*Android Debug" /tmp/release-signature.txt; then
            fail "Release APK is signed with the Android debug certificate"
          fi
          if ! grep -q "key size (bits): 4096" /tmp/release-signature.txt; then
            fail "Release signing key is not RSA 4096"
          fi

          # The two artifacts must not share a signing certificate.
          digest_of() { grep -o 'certificate SHA-256 digest: [0-9a-f]*' "$1" | head -1 | awk '{print $NF}'; }
          debug_digest="$(digest_of /tmp/debug-signature.txt)"
          release_digest="$(digest_of /tmp/release-signature.txt)"
          [ -n "$debug_digest" ] || fail "Could not read the debug signing certificate digest"
          [ -n "$release_digest" ] || fail "Could not read the release signing certificate digest"
          [ "$debug_digest" != "$release_digest" ] || fail "Release APK shares the debug signing certificate"

          echo "--- release manifest ---"
          "$AAPT2" dump badging "$debug_apk" > /tmp/debug-badging.txt
          "$AAPT2" dump badging "$release_apk" > /tmp/release-badging.txt
          head -5 /tmp/release-badging.txt

          assert_contains() {
            if ! grep -q "$2" "$1"; then fail "$3"; fi
          }
          assert_absent() {
            if grep -q "$2" "$1"; then fail "$3"; fi
          }

          assert_contains /tmp/debug-badging.txt "package: name='com.hmx.harness.debug'" "Debug package id is not com.hmx.harness.debug"
          assert_contains /tmp/release-badging.txt "package: name='com.hmx.harness'" "Release package id is not com.hmx.harness"
          assert_contains /tmp/release-badging.txt "versionCode='1'" "Release versionCode is not 1"
          assert_contains /tmp/release-badging.txt "versionName='1.0.0'" "Release versionName is not 1.0.0"
          assert_absent   /tmp/release-badging.txt "application-debuggable" "Release APK is debuggable"
          assert_absent   /tmp/release-badging.txt "com.hmx.harness.debug" "Release APK references the debug application id"
          assert_contains /tmp/release-badging.txt "native-code: 'arm64-v8a'" "Release APK is missing arm64-v8a"

          echo "--- native libraries ---"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            if ! unzip -l "$release_apk" "lib/$abi/*" | grep -q "lib/$abi/"; then
              fail "Release APK is missing native libraries for $abi"
            fi
          done

          echo "--- release certificate (public metadata) ---"
          grep -E "certificate DN|key algorithm|key size|SHA-256 digest" /tmp/release-signature.txt

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p dist
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            mkdir -p dist/debug
            cp app/build/outputs/apk/debug/app-debug.apk dist/debug/HMXHARNESS-debug.apk
            cp app/build/outputs/gpuRuntime/debug/*.gz dist/debug/ 2>/dev/null || true
            (cd dist/debug && sha256sum * > SHA256SUMS.txt)
            git rev-parse HEAD > dist/debug/SOURCE_COMMIT.txt
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            mkdir -p dist/release
            cp app/build/outputs/apk/release/app-release.apk dist/release/HMXHARNESS-release.apk
            cp /tmp/release-signature.txt dist/release/signing-certificate.txt 2>/dev/null || true
            (cd dist/release && sha256sum HMXHARNESS-release.apk > SHA256SUMS.txt)
            git rev-parse HEAD > dist/release/SOURCE_COMMIT.txt
          fi
          ls -lR dist || true

      - name: Upload debug artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: HMXHARNESS-debug-${{ github.sha }}
          path: dist/debug/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload release artifact
        # A release artifact that failed verification must not be published.
        if: always() && steps.verify.outcome == 'success' 
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: HMXHARNESS-release-${{ github.sha }}
          path: dist/release/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/hmx-release-keystore" "$RUNNER_TEMP/hmx-release-keystore.old"
