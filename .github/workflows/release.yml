name: HMXHARNESS stable release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: New stable release tag (for example v1.1.0)
        required: true
        type: string

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Install Android SDK and native tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -maxdepth 5 -type f -name sdkmanager 2>/dev/null | sort | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          for pkg in "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018" "cmake;3.22.1"; do
            "$SDKMANAGER" "$pkg"
          done
          sudo apt-get update
          sudo apt-get install -y glslc

      - name: Prepare permanent release keystore
        env:
          HMX_RELEASE_STORE_FILE_BASE64: ${{ secrets.HMX_RELEASE_STORE_FILE_BASE64 }}
          HMX_RELEASE_STORE_PASSWORD: ${{ secrets.HMX_RELEASE_STORE_PASSWORD }}
          HMX_RELEASE_KEY_ALIAS: ${{ secrets.HMX_RELEASE_KEY_ALIAS }}
          HMX_RELEASE_KEY_PASSWORD: ${{ secrets.HMX_RELEASE_KEY_PASSWORD }}
        run: |
          set -eu
          test -n "${HMX_RELEASE_STORE_FILE_BASE64:-}"
          test -n "${HMX_RELEASE_STORE_PASSWORD:-}"
          test -n "${HMX_RELEASE_KEY_ALIAS:-}"
          test -n "${HMX_RELEASE_KEY_PASSWORD:-}"
          umask 077
          printf '%s' "$HMX_RELEASE_STORE_FILE_BASE64" | base64 --decode > "$RUNNER_TEMP/hmx-release-keystore"
          keytool -list -keystore "$RUNNER_TEMP/hmx-release-keystore" -storepass:env HMX_RELEASE_STORE_PASSWORD -alias "$HMX_RELEASE_KEY_ALIAS" > /dev/null
          echo "HMX_RELEASE_STORE_FILE=$RUNNER_TEMP/hmx-release-keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          HMX_RELEASE_STORE_PASSWORD: ${{ secrets.HMX_RELEASE_STORE_PASSWORD }}
          HMX_RELEASE_KEY_ALIAS: ${{ secrets.HMX_RELEASE_KEY_ALIAS }}
          HMX_RELEASE_KEY_PASSWORD: ${{ secrets.HMX_RELEASE_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --no-daemon --stacktrace --max-workers=2

      - name: Verify and prepare release assets
        env:
          GH_REPOSITORY: bharti1233/Hmx-coder
          GH_TAG: ${{ inputs.release_tag || github.ref_name }}
          GH_EVENT: ${{ github.event_name }}
        run: |
          set -eu
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT2="$ANDROID_HOME/build-tools/37.0.0/aapt2"
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          test -f "$APK"
          "$APKSIGNER" verify --print-certs "$APK"
          BADGING="$("$AAPT2" dump badging "$APK")"
          echo "$BADGING" | grep -q "package: name='com.hmx.harness'"
          VERSION_NAME="$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          VERSION_CODE="$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          [[ "$GH_TAG" == v* ]] || { echo "Stable releases must use a v-prefixed tag."; exit 1; }
          if [[ "$GH_EVENT" == "push" || "$GH_EVENT" == "workflow_dispatch" ]]; then
            API="https://api.github.com/repos/$GH_REPOSITORY/releases/latest"
            LATEST="$(curl --fail --silent --show-error -H 'Accept: application/vnd.github+json' "$API" || true)"
            LATEST_METADATA_URL="$(echo "$LATEST" | sed -n 's/.*"name"[[:space:]]*:[[:space:]]*"update.json"[^}]*"browser_download_url"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)"
            LATEST_CODE=""
            if [[ -n "$LATEST_METADATA_URL" ]]; then
              LATEST_CODE="$(curl --fail --silent --show-error "$LATEST_METADATA_URL" | sed -n 's/.*"versionCode"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p' | head -1)"
            fi
            if [[ -n "$LATEST_CODE" ]] && (( VERSION_CODE <= LATEST_CODE )); then
              echo "versionCode $VERSION_CODE must be greater than latest release $LATEST_CODE"
              exit 1
            fi
          fi
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c '%s' "$APK")"
          mkdir -p dist
          cp "$APK" dist/HMXHARNESS-release.apk
          cat > dist/update.json <<EOF
          {
            "schemaVersion": 1,
            "applicationId": "com.hmx.harness",
            "versionName": "$VERSION_NAME",
            "versionCode": $VERSION_CODE,
            "channel": "stable",
            "apkAssetName": "HMXHARNESS-release.apk",
            "apkUrl": "https://github.com/$GH_REPOSITORY/releases/download/$GH_TAG/HMXHARNESS-release.apk",
            "apkSha256": "$SHA256",
            "apkSizeBytes": $SIZE,
            "releaseNotes": "See CHANGELOG.md",
            "minSupportedVersionCode": 1,
            "mandatory": false,
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cp CHANGELOG.md dist/CHANGELOG.md
          (cd dist && sha256sum HMXHARNESS-release.apk update.json CHANGELOG.md > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release create "$GH_TAG" dist/HMXHARNESS-release.apk dist/update.json dist/SHA256SUMS.txt dist/CHANGELOG.md --target "${{ github.sha }}" --generate-notes --title "HMXHARNESS $GH_TAG"

      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/hmx-release-keystore"
