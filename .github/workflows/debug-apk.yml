name: HMX Debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hmx-debug-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=""
          for candidate in \
            "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -maxdepth 5 -type f -name sdkmanager 2>/dev/null | sort | tail -1)"
          fi
          test -n "$SDKMANAGER"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          for pkg in "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018" "cmake;3.22.1"; do
            echo "::group::sdkmanager $pkg"
            "$SDKMANAGER" "$pkg" || echo "WARN: sdkmanager could not install $pkg"
            echo "::endgroup::"
          done
          ls -1 "$ANDROID_HOME/ndk" "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true

      - name: Install shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc
          glslc --version

      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace --max-workers=2

      - name: Collect APK and matching GPU packages
        if: always()
        run: |
          mkdir -p dist
          find app/build/outputs/apk/debug -name '*.apk' -exec cp -v {} dist/HMX-Coder-AI-debug.apk \; || true
          find app/build/outputs/gpuRuntime/debug -name '*.gz' -exec cp -v {} dist/ \; || true
          if [ -f dist/HMX-Coder-AI-debug.apk ]; then
            (cd dist && sha256sum * > SHA256SUMS.txt)
            git rev-parse HEAD > dist/SOURCE_COMMIT.txt
          else
            echo "No debug APK was produced" > dist/BUILD-FAILED.txt
          fi
          ls -l dist

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: HMX-Coder-AI-debug-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Unit tests
        if: always()
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace --max-workers=2

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: HMX-build-reports-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
