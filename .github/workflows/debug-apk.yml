name: HMX Debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hmx-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android and native build tools
        run: |
          sdkmanager 'platforms;android-37' 'build-tools;37.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          sudo apt-get update
          sudo apt-get install -y glslc
      - name: Unit tests
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace --max-workers=2
      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace --max-workers=2
      - name: Collect APK and matching GPU packages
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/HMX-Coder-AI-debug.apk
          cp app/build/outputs/gpuRuntime/debug/*.gz dist/
          sha256sum dist/* > dist/SHA256SUMS.txt
          git rev-parse HEAD > dist/SOURCE_COMMIT.txt
      - name: Upload debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HMX-Coder-AI-debug-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HMX-build-reports-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
