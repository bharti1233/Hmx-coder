name: HMX Debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hmx-debug-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          set -x
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 2 -type f -name sdkmanager | sort | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          while read -r pkg; do
            [ -z "$pkg" ] && continue
            echo "::group::sdkmanager $pkg"
            "$SDKMANAGER" "$pkg" || echo "WARN: sdkmanager could not install $pkg"
            echo "::endgroup::"
          done <<'PKGS'
          platform-tools
          platforms;android-37.0
          build-tools;37.0.0
          ndk;27.2.12479018
          cmake;3.22.1
          PKGS
          ls -1 "$ANDROID_HOME/ndk" "$ANDROID_HOME/platforms" || true

      - name: Install shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc
          glslc --version

      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace --max-workers=2

      - name: Collect APK and matching GPU packages
        if: always()
        run: |
          mkdir -p dist
          find app/build/outputs/apk/debug -name '*.apk' -exec cp -v {} dist/HMX-Coder-AI-debug.apk \; || true
          find app/build/outputs/gpuRuntime/debug -name '*.gz' -exec cp -v {} dist/ \; || true
          if [ -f dist/HMX-Coder-AI-debug.apk ]; then
            sha256sum dist/* > dist/SHA256SUMS.txt
            git rev-parse HEAD > dist/SOURCE_COMMIT.txt
          else
            echo "No debug APK was produced" > dist/BUILD-FAILED.txt
          fi
          ls -l dist

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HMX-Coder-AI-debug-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Unit tests
        if: always()
        continue-on-error: true
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace --max-workers=2

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HMX-build-reports-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
