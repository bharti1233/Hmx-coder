name: Phase 1 Android security regression

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  instrumentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
      - name: Install emulator and build tools
        env:
          API: ${{ matrix.api }}
        run: |
          set -eu
          sdkmanager --install "platform-tools" "emulator" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018" "cmake;3.22.1" "system-images;android-$API;google_apis;x86_64"
          sudo apt-get update
          sudo apt-get install -y glslc
          sudo chmod 666 /dev/kvm
          echo no | avdmanager create avd --force --name security --package "system-images;android-$API;google_apis;x86_64"
      - name: Run full instrumentation suite
        run: |
          set -eu
          mkdir -p device-results
          "$ANDROID_HOME/emulator/emulator" -avd security -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > device-results/emulator.log 2>&1 &
          timeout 300 adb wait-for-device
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
          adb shell input keyevent 82
          adb logcat -c
          bash ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace --max-workers=2
      - name: Preserve device diagnostics
        if: always()
        run: |
          mkdir -p device-results
          timeout 30 adb logcat -d > device-results/logcat.txt 2>&1 || true
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-device-api-${{ matrix.api }}-${{ github.sha }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            device-results/
